services:
  db:
    image: postgres:15-alpine
    container_name: fundschain-db
    env_file:
      - .env
    environment:
      # Map the generic POSTGRES variables to your custom .env names
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Automatically initialize database schema on startup
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    image: node:18-alpine
    container_name: fundschain-backend
    working_dir: /app
    volumes:
      - ./backend:/app
    ports:
      - "${PORT_CORE_API}:5000"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - db
    env_file:
      - .env

  frontend:
    image: node:18-alpine
    container_name: fundschain-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "${PORT_TRAINEE_PORTAL}:5173"
    # Runs Vite server on configured port mapping directly to the host environment
    # command: sh -c "npm install && npm run dev -- --host"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://localhost:${PORT_CORE_API}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN}

volumes:
  pgdata: